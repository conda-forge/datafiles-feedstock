schema_version: 1

context:
  name: datafiles
  version: '2.6'
  build_number: 0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/datafiles-${{ version }}.tar.gz
  sha256: 11af45ec55e0b5b29d2fd5e4ad5d4cde9c3bb61fd137d2c5a8231a3b3d2525b7

build:
  number: ${{ build_number }}
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}.0
    - ruamel.yaml >=0.18.10,<0.20.0
    - tomlkit >=0.10.1,<0.16.0
    - parse >=1.12.0,<2.0.0
    - cached_property >=1.5.0,<3.0.0
    - classproperties >=0.2.0,<0.3.0
    - minilog >=2.3.0,<3.0.0
    - json5 >=0.13.0
tests:
  - python:
      imports:
        - datafiles
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: File-based ORM for dataclasses.
  license: MIT
  license_file: LICENSE.md
  homepage: https://pypi.org/project/datafiles

extra:
  recipe-maintainers:
    - jacebrowning
    - diegoferigo
